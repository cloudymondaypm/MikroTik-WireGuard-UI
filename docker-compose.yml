services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - wg-ui-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args: {}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  wg-ui-data:
